name: 'Reusable Greeting Action'
description: 'Greet someone and record the current time without logging event payloads'
inputs:
  who-to-greet:
    description: 'Who to greet'
    required: true
    default: 'World'
outputs:
  time:
    description: 'The UTC time the greeting was generated'
runs:
  using: 'node20'
  main: 'index.js'
